[project]
name = "prime-agent-skill-hashline"
version = "0.1.0"
description = "Hash-anchored file editing for Prime Agent via the hashline MCP server (stdio)."
requires-python = ">=3.10"
dependencies = ["mcp", "prime-agent-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hashline"]
